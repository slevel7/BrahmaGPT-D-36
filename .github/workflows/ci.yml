name: Verify BrahmaGPT
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: brahma
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: brahmagpt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brahma -d brahmagpt"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - run: python -m ruff check services scripts
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
        working-directory: services/api
      - run: python -m alembic upgrade head
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://brahma:ci-disposable-only@localhost:5432/brahmagpt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://brahma:ci-disposable-only@localhost:5432/brahmagpt
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r services/api/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: apps/web/test-results
