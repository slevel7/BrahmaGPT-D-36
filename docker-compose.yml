services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: brahma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: brahmagpt
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U brahma -d brahmagpt]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://brahma:${POSTGRES_PASSWORD:-local-development-only}@db:5432/brahmagpt
      DEMO_MODE: ${DEMO_MODE:-true}
      STORAGE_DIR: /data/files
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      LOCAL_MODEL: ${LOCAL_MODEL:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: [python, /worker/main.py]
    environment:
      <<: *api-env
      PYTHONPATH: /app
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  files:
